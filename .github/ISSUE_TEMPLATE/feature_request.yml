name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? We'd love to hear it.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Transport (TCP / HDLC / M-Bus / optical)
        - Association / authentication / ciphering
        - GET / SET / ACTION
        - Push / DataNotification decode
        - COSEM interface classes / OBIS catalog
        - Companion profile (IDIS / DSMR / Austrian)
        - CLI tool
        - Cross-platform support
        - Documentation
        - Testing
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: Why do you need this? What problem does it solve?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you tried any workarounds?
    validations:
      required: false
