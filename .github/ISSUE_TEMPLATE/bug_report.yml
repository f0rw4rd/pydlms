name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `pip show pydlms-client` or git commit hash
      placeholder: "0.3.0"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Transport (TCP / HDLC / M-Bus / optical)
        - Association / authentication
        - Ciphering / security
        - GET / SET / ACTION
        - Push / DataNotification decode
        - COSEM data / OBIS decode
        - CLI tool
        - Other
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal code or CLI commands to reproduce the issue
      render: python
    validations:
      required: true

  - type: textarea
    id: device
    attributes:
      label: Device / Environment
      description: Meter manufacturer/model, transport, Python version, OS
      placeholder: |
        - Meter: Landis+Gyr E450
        - Transport: TCP 4059 / HDLC serial / M-Bus
        - Python: 3.12.1
        - OS: Ubuntu 24.04
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / Wireshark capture
      description: Paste any error output or attach a pcap
      render: text
    validations:
      required: false
